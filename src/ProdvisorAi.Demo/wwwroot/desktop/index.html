<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PRODVISOR – Karta technologiczna</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">PRODVISOR <span>DESKTOP</span></div>
    <nav id="modes">
      <a href="#" data-mode="konstruktor" title="Materiał, ilość i wymiary odczytane z rysunku">Konstruktor</a>
      <a href="#" data-mode="technolog" title="Pełna technologia: operacje, maszyny, czasy, materiał, wymiary, ilość">Technolog</a>
    </nav>
    <span class="small">Symulacja – serwis AI tylko przez <span class="mono">/api/v1</span></span>
    <div class="right"><a class="link" href="/">Panel serwisu AI →</a></div>
  </header>

  <div class="page">
    <div class="desk">
      <aside class="card elements">
        <div class="row" style="justify-content:space-between;padding:10px 12px 8px 16px"><h3 style="padding:0">Elementy</h3><button class="btn small primary" id="add-element">+ Nowy element</button></div>
        <div id="element-list"></div>
      </aside>

      <main id="workspace" style="display:flex;flex-direction:column;gap:16px">
        <div class="card muted">Wybierz element z listy.</div>
      </main>
    </div>
  </div>

  <script src="desktop.js"></script>
</body>
</html>
